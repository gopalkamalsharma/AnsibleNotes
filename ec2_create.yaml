---
- name: Start an EC2 instance with a public IP address
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - secrets.yaml
  tasks:
    - name: start an instance with a public IP address 
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        key_name: "UniversalKey"
        instance_type: t3.micro
        security_group: default
        access_key: "{{ ec2_access_key }}"
        secret_key: "{{ ec2_secret_key }}"
        network_interfaces:
          - assign_public_ip: true
        image_id: "{{ item.ami }}"
        tags:
          Name: "{{ item.name }}"
          Managed: "Ansible"
      loop:
        - {ami: ami-01a00762f46d584a1, name: Node-1}
        - {ami: ami-01a00762f46d584a1, name: node-2}
        - {ami: ami-01a00762f46d584a1, name: node-3}